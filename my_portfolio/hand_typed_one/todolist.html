<!DOCTYPE  html>
<html lang="ja">
    <head>
    <meta charset="UTF-8">
    <title>to do list</title>
    <style>

        *{
          box-sizing:border-box;
          margin:0;
          padding:0;
          transition:all 0.25s ease ;
        }


          body, html {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            width: 100%;
            min-height: 100%;
            padding: 1rem;
        }

      .wholeContainer{
        border:1px solid black;
        border-radius:15px;
        max-width:500px;
        display:flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        min-width: 500px;
      }
      .upperHalfContainer{
        position: relative;
        width: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }

  .addButton {
  padding: 10px 20px;
  background-color: #4CAF50;
  color: white;
    border: 0;
    border-bottom: 5px solid #367039;
  border-radius: 4px;
  cursor: pointer;
  transition:all 0.03s ease;
  margin:5px;

}
.addButton:hover {
  background-color: #5fc962;
  border-bottom:5px solid #478a4a;
}
.addButtonPushed{
  background-color: #63c266;
  border-bottom:0px!important;
  transform:translateY(5px);
  transition:all 0.03s ease;
} 
      .inputContainer{
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      ul{
        border-radius:15px;
        border:1px solid black;
        max-width: 100%;
        width: 100%;
        overflow: hidden;
      }
      .list{
        color:black;
      }
      span{
        color:black;
        width: 80%;
        overflow: hidden;
        overflow-wrap: break-word;
        padding: 0 1em;
      }
      .deleteButton{
        color:white;
        background:red;
        border-radius:10px;
        height:35px;
        width:50px;
        font-size:15px;
        text-align: center;
        padding-right: 8px;
        padding-left: 2.5px;
      }

      li{
        list-style-type:none;
        display: flex;
      
        padding: 5px 20px;
        
      }

      ul{
            padding-left: 0;
            
      }

      .completed{
        text-decoration: line-through;
      }
      
      .pritorityContainer{
        display: flex;
        justify-content: center;
      }

      #sort{
        position: absolute;
        right:0px;
        bottom: 0;
      }

      .priority1{
        border-left:red 10px solid;
      }
      .priority2{
        border-left:yellow 10px solid;
      }
      .priority3{
        border-left:blue 10px solid;
      }
      
      
      .taskCompleted{
      animation-name:completed;
      animation-timing-function: ease;
      animation-duration:0.25s;

      }
      @keyframes completed{
      from{opacity:1;
                  transform:translateY(0px);
      }
      to{opacity:0;
            transform:translateY(30px);
      }
      }


            .receivingInCompletedList{
      animation-name:receiving;
      animation-timing-function: ease;
      animation-duration:0.25s;
      }

      @keyframes receiving{
      from{opacity:0;
                  transform:translateY(-30px);
      }
      to{opacity:1;
            transform:translateY(0px);
      }
      }



    </style>
    </head>
    <body>

      <div class="wholeContainer">
        <div class="upperHalfContainer">
            <p>To-Do List</p>
            <p>タスクを入力してください</p>
            <button id="sort">整列</button>
            <div class="inputContainer">
            <input type="text" id="inputField" class="priority2">
            
            <div class="pritorityContainer">
            <p>優先度：</p>
            <select name="priority_selector" id="priority">
                <option value="1">🔴高</option>
                <option value="2" selected="selected">🟡中</option>
                <option value="3">🔵低</option>
            </select>
            </div>
            
              </div>
                          <button class="addButton" id="addButton">+</button>

          </div>

        <ul id="taskList">








        </ul>






      </div>





  <script src="todolist.js"></script><!--Where to put JS sheet is before the closing body tag.   -->
    </body>
</html>
