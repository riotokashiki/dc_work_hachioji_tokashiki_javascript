<!DOCTYPE  html>
<html lang="ja">
    <head>
    <meta charset="UTF-8">
    <title>to do list</title>
    <style>

        *{
          box-sizing:border-box;
          margin:0;
          padding:0;
        }


      body,html{
        display: flex;
        justify-content: center;
        align-items:center;
        width:100%;
        height:100%;
      }

      .wholeContainer{
        border:1px solid black;
        border-radius:15px;
        max-width:500px;
        display:flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        min-width: 500px;
      }
      .upperHalfContainer{
        position: relative;
        width: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }

      .addButton{
        border:1px solid black;
        background: green;
        width: 15%;
      }
      .inputContainer{
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      ul{
        border-radius:15px;
        border:1px solid black;
        max-width: 100%;
        width: 100%;
      }
      .list{
        color:black;
      }
      span{
        color:black;
        width: 80%;
        overflow: hidden;
        overflow-wrap: break-word;
        padding: 0 1em;
      }
      .deleteButton{
        color:white;
        background:red;
        border-radius:10px;
        height:35px;
        width:50px;
        font-size:15px;
        text-align: center;
        padding-right: 8px;
        padding-left: 2.5px;
      }

      li{
        list-style-type:none;
        display: flex;
      
        padding: 5px 20px;
        border-radius:15px;
      }

      ul{
            padding-left: 0;
            
      }

      .completed{
        text-decoration: line-through;
      }
      
      .pritorityContainer{
        display: flex;
        justify-content: center;
      }

      #sort{
        position: absolute;
        right:0px;
        bottom: 0;
      }

      .priority1{
        border-left:red 5px solid;
      }
      .priority2{
        border-left:yellow 5px solid;
      }
      .priority3{
        border-left:blue 5px solid;
      }

    </style>
    </head>
    <body>

      <div class="wholeContainer">
        <div class="upperHalfContainer">
            <p>To-Do List</p>
            <p>タスクを入力してください</p>
            <button id="sort">整列</button>
            <div class="inputContainer">
            <input type="text" id="inputField" class="priority2">
            
            <div class="pritorityContainer">
            <p>優先度：</p>
            <select name="priority_selector" id="priority">
                <option value="1">🔴高</option>
                <option value="2" selected="selected">🟡中</option>
                <option value="3">🔵低</option>
            </select>
            <button class="addButton" id="addButton">+</button>
            </div>
            
              </div>
          </div>

        <ul id="taskList">








        </ul>






      </div>





  <script src="todolist.js"></script><!--Where to put JS sheet is before the closing body tag.   -->
    </body>
</html>
