<!DOCTYPE  html>
<html lang="ja">
    <head>
    <meta charset="UTF-8">
    <title>to do list</title>
    <style>

        *{
          box-sizing:border-box;
          margin:0;
          padding:0;
        }


      body,html{
        display: flex;
        justify-content: center;
        align-items:center;
        width:100%;
        height:100%;
      }

      .wholeContainer{
        border:1px solid black;
        border-radius:15px;
        width:500px;
        display:flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        position: relative;
      }
      .addButton{
        border:1px solid black;
        background: green;
        width: 15%;
      }
      .inputContainer{
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      ul{
        border-radius:15px;
        border:1px solid black;
      }
      .list{
        color:black;
      }
      .span{
        color:black;
      }
      .deleteButton{
        color:white;
        background:red;
        border-radius:10px;
        height:35px;
        width:50px;
        font-size:15px;
        text-align: center;
        padding-right: 8px;
        padding-left: 2.5px;
      }

      li{
        list-style-type:none;
        display: flex;
        justify-content: space-between;
        padding: 5px 20px;
      }

      ul{
            padding-left: 0;
      }

      .completed{
        text-decoration: line-through;
      }
      
      .pritorityContainer{
        display: flex;
        justify-content: center;
      }

      #sort{
        position: absolute;
        right:0px;
        top:22%;
      }

    </style>
    </head>
    <body>

      <div class="wholeContainer">
        <p>To-Do List</p>
        <p>タスクを入力してください</p>
        <button id="sort">整列</button>
        <div class="inputContainer">
        <input type="text" id="inputField">
        
        <div class="pritorityContainer">
        <p>優先度：</p>
        <select name="priority_selector" id="priority">
            <option value="1">高</option>
            <option value="2" selected="selected">中</option>
            <option value="3">低</option>
        </select>
        <button class="addButton" id="addButton">+</button>
        </div>
        
          </div>
        <ul id="taskList">








        </ul>






      </div>





  <script src="todolist.js"></script><!--Where to put JS sheet is before the closing body tag.   -->
    </body>
</html>
