<!DOCTYPE  html>
<html lang="ja">
    <head>
    <meta charset="UTF-8">
    <title>to do list</title>
    <style>

        *{
          box-sizing:border-box;
          margin:0;
          padding:0;
        }


          body, html {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            width: 100%;
            min-height: 100%;
            padding: 1rem;
        }

      .wholeContainer{
        border:1px solid black;
        border-radius:15px;
        max-width:500px;
        display:flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        min-width: 500px;
      }
      .upperHalfContainer{
        position: relative;
        width: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }

  .addButton {
  padding: 10px 20px;
  background-color: #4CAF50;
  color: white;
    border: 0;
    border-bottom: 5px solid #367039;
  border-radius: 4px;
  cursor: pointer;
  transition:all 0.03s ease;
  margin:5px;

}
.addButton:hover {
  background-color: #5fc962;
  border-bottom:5px solid #478a4a;
}
.addButtonPushed{
  background-color: #63c266;
  border-bottom:0px!important;
  transform:translateY(5px);
  transition:all 0.03s ease;
} 
      .inputContainer{
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      ul{
        border-radius:15px;
        border:1px solid black;
        max-width: 100%;
        width: 100%;
        overflow: hidden;
      }
      .list{
        color:black;
      }
      span{
        color:black;
        width: 80%;
        overflow: hidden;
        overflow-wrap: break-word;
        padding: 0 1em;
      }
      .deleteButton{
        color:white;
        background:red;
        border-radius:10px;
        height:35px;
        width:50px;
        font-size:15px;
        text-align: center;
        padding-right: 8px;
        padding-left: 2.5px;
      }

      li{
        list-style-type:none;
        display: flex;
      
        padding: 5px 20px;
        overflow: hidden;
      }

      ul{
            padding-left: 0;
            
      }

      .completed{
        text-decoration: line-through;
      }
      
      .pritorityContainer{
        display: flex;
        justify-content: center;
      }

      #sort{
        position: absolute;
        right:0px;
        bottom: 0;
      }

      .priority1{
        border-left:red 10px solid;
      }
      .priority2{
        border-left:yellow 10px solid;
      }
      .priority3{
        border-left:blue 10px solid;
      }
      
      
      .taskCompleted{
      animation-name:completed;
      animation-timing-function: ease;
      animation-duration:0.25s;

      }
      @keyframes completed{
      from{opacity:1;
                  max-height: 2rem;
      }
      to{opacity:0;
            max-height: 0rem;
      }
      }


            .receivingInCompletedList{
      animation-name:receiving;
      animation-timing-function: ease;
      animation-duration:0.25s;
      }

      @keyframes receiving{
      from{opacity:0;
                  transform:translateY(-30px);
      }
      to{opacity:1;
            transform:translateY(0px);
      }
      }

      .smoothGrowing{
        animation :growingDown 0.25s ease;
      }
      @keyframes growingDown{
      from{opacity:0;
                  max-height: 0rem;
      }
      to{opacity:1;
            max-height: 2rem;
      }
      }

      .uncompetedListContainer{
        width: 100%;
      }
      .completedListContainer{
        width: 100%;
      }

      .center{
        text-align: center;
      }

      .choiceWrapper1{
       background-color: rgb(248, 147, 147);
       display: flex;
       flex-direction: column;
       width: 2rem;
       justify-content: center;
       align-items: center;
      }
       .choiceWrapper2{
       background-color: rgb(243, 248, 147);
          display: flex;
       flex-direction: column;
        width: 2rem;
       justify-content: center;
       align-items: center;
      }
       .choiceWrapper3{
       background-color: rgb(147, 177, 248);
          display: flex;
       flex-direction: column;
        width: 2rem;
       justify-content: center;
       align-items: center;
      }

      .priority-title{
        display: flex;
        justify-content: center;
        align-items: center;
      }


      .smoothDelete{
        animation :smoothDelete 0.15s ease;
      }

         @keyframes smoothDelete{
      from{opacity:1;
                  max-height: 2rem;
      }
      to{opacity:0;
            max-height: 0rem;
      }
      }



    </style>
    </head>
    <body>

      <div class="wholeContainer">
        <div class="upperHalfContainer">
            <p>To-Do List</p>
            <p>タスクを入力してください</p>
            <button id="sort">優先度順に整列</button>
            <div class="inputContainer">
            <input type="text" id="inputField" class="priority2">
            
            <div class="pritorityContainer">
            <p class="priority-title">優先度：</p>
            <div class="choiceWrapper1">
                <input type="radio" id="priorityChoice1" name="priority" value="1">
                <label for="priorityChoice1">高</label>
            </div>
            <div class="choiceWrapper2">
                <input type="radio" id="priorityChoice2" name="priority" value="2" checked>
                <label for="priorityChoice2">中</label>
            </div>
            <div class="choiceWrapper3">
                <input type="radio" id="priorityChoice3" name="priority" value="3">
                <label for="priorityChoice3">低</label>
            </div>
            </div>
            
              </div>
                          <button class="addButton" id="addButton">+</button>

          </div>
          <div class="uncompetedListContainer">
        <ul id="taskList">








        </ul>






      </div>
      <div class="completedListContainer">


      </div>

</div>




  <script src="todolist.js"></script><!--Where to put JS sheet is before the closing body tag.   -->
    </body>
</html>
